name: CI

on:
  push:
    branches: ["trunk"]
    tags: ["v*"]
  pull_request:
    branches: ["trunk"]

permissions:
  contents: read

jobs:
  tox:
    name: "tox -e ${{ matrix.tox-env }}"

    strategy: 
      matrix:
        tox-env: ["test", "lint"]

    runs-on: ubuntu-24.04
    env:
      TOXENV: "${{ matrix.tox-env }}"
      RUFF_OUTPUT_FORMAT: "github"

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - uses: actions/setup-python@v6.0.0
      with:
        python-version-file: '.python-version'
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements_*.txt

    - run: "python -m pip install tox"

      # Temporary hack: create files normally created by bin/compile-static.py
      # that are expected to exist by the manifest.json view test.
    - run: |
        mkdir yarrharr/static
        touch yarrharr/static/icon-xyz.{ico,png,svg}
        touch yarrharr/static/{normalize,main,fonts}-xyz.css
        touch yarrharr/static/{runtime,vendor,main}-xyz.js

    - run: "python -m tox"

  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: apt install
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-suggests --no-install-recommends inkscape scour

    - uses: actions/setup-python@v6.0.0
      with:
        python-version-file: '.python-version'
        cache: 'pip'
        cache-dependency-path: |
          requirements_static.txt

    - run: "python -m pip install tox"

    - run: "python -m tox -e static --notest"

    - run: "tox -e static"

    - run: "bin/release.sh"

    - uses: actions/upload-artifact@v6
      with:
        name: dist
        path: dist/*.*
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

    - uses: actions/download-artifact@v6
      with:
        name: dist
        path: dist/

    - run: |
        set -eux
        tag="${TAG_REF##*/}"
        version=${tag#v}
        gh release create "$tag" \
            --repo twm/yarrharr \
            --verify-tag \
            --title "Yarrharr $version" \
            --generate-notes \
            "dist/yarrharr-${version}.tar.gz" \
            "dist/yarrharr-${version}"*.whl
      env:
        GH_TOKEN: ${{ github.token }}
        TAG_REF: ${{ github.ref }}
