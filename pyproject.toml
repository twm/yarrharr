[build-system]
requires = ["hatchling", "incremental>=24.7.2"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
name = "yarrharr"
license = {text = "GPLv3+"}
readme = "README.md"
dependencies = [
    "attrs >= 21.3.0",
    "cattrs >= 25.1.1",
    "Django >=4.2.1,<5.3",
    "twisted[tls]>=26.4.0",
    "treq>=26.7.0",
    "forkparser >= 2026.1.0",
    "html5lib == 1.1",
]
requires-python = "==3.12.*"
authors = [
  {name = "Tom Most", email = "twm@freecog.net"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Framework :: Django",
    "Framework :: Twisted",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
homepage = "https://github.com/twm/yarrharr"

[project.scripts]
yarrharr = "yarrharr.scripts.yarrharr:main"
yarrharr-fetch = "yarrharr.scripts.fetch:main"
yarrharr-rotate = "yarrharr.scripts.rotate:main"

[tool.hatch.build.targets.sdist]
packages = ["yarrharr"]
artifacts = ["/yarrharr/static"]

[tool.hatch.build.targets.wheel]
packages = ["yarrharr"]
artifacts = ["/yarrharr/static"]

[tool.hatch.version]
source = "incremental"

[tool.ruff]
line-length = 150
target-version = "py39"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]
ignore = [
]

[tool.ruff.lint.per-file-ignores]
"yarrharr/wsgi.py" = ["E402"]
"yarrharr/migrations/*.py" = ["I", "F401"]

[tool.pytest]
addopts = ["-vvv", "--tb=native"]
filterwarnings = [
    "all",
    "ignore::ImportWarning",
    # This is a Twisted bug, see https://twistedmatrix.com/trac/ticket/8227 and https://twistedmatrix.com/trac/ticket/8929
    "ignore:Using readBody with a transport that does not have an abortConnection method:DeprecationWarning",
    # Tracked in https://github.com/twm/yarrharr/issues/659
    "ignore:html5lib's sanitizer:DeprecationWarning",
    # Tracked in https://github.com/twisted/twisted/issues/12172
    "ignore:twisted.web.resource._Unsafe:DeprecationWarning:",
    # This setting will be removed upon upgrade to Django 6.0
    "ignore:The FORMS_URLFIELD_ASSUME_HTTPS transitional setting is deprecated.:",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]  # Only Linux
python-preference = "only-system"

[dependency-groups]
dev = [
    "cssselect>=1.5.0",
    "lxml>=6.1.1",
    "pytest>=9.1.1",
    "pytest-django>=4.11.1",
    "pytest-twisted>=1.14.3",
    "pytest-xdist>=3.8.0",
]
lint = [
    "ruff>=0.16.0",
]
release = [
    "build>=1.5.0",
    "hatch>=1.17.1",
    "twine>=7.0.0",
]
