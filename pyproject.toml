[build-system]
requires = ["hatchling", "incremental>=24.7.2"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
name = "yarrharr"
license = {text = "GPLv3+"}
readme = "README.md"
dependencies = [
    "attrs >= 21.3.0",
    "cattrs >= 25.1.1",
    "Django >=4.2.1,<5.3",
    "Twisted[tls] >= 22.10.0",
    "treq >= 22.2.0",
    "feedparser >= 6.0.8",
    "html5lib == 1.1",
]
requires-python = ">=3.12"
authors = [
  {name = "Tom Most", email = "twm@freecog.net"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Framework :: Django",
    "Framework :: Twisted",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
homepage = "https://github.com/twm/yarrharr"

[project.scripts]
yarrharr = "yarrharr.scripts.yarrharr:main"
yarrharr-fetch = "yarrharr.scripts.fetch:main"
yarrharr-rotate = "yarrharr.scripts.rotate:main"

[tool.hatch.build.targets.sdist]
packages = ["yarrharr"]
artifacts = ["/yarrharr/static"]

[tool.hatch.build.targets.wheel]
packages = ["yarrharr"]
artifacts = ["/yarrharr/static"]

[tool.hatch.version]
source = "incremental"

[tool.ruff]
line-length = 150
target-version = "py39"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]
ignore = [
]

[tool.ruff.lint.per-file-ignores]
"yarrharr/wsgi.py" = ["E402"]
"yarrharr/migrations/*.py" = ["I", "F401"]

[tool.uv]
environments = ["sys_platform == 'linux'"]  # Only Linux
